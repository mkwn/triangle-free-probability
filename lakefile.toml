name = "RequestProject"
defaultTargets = ["Target"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "TriangleNumerical"
globs = ["TriangleNumerical.+"]

[[lean_lib]]
name = "Target"
globs = ["Target"]

# Comparator builds this independently of Target. Its deliberate reference
# theorem hole is not imported by the proof and is not a default build target.
[[lean_lib]]
name = "Challenge"
globs = ["Challenge"]
